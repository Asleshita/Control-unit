th",short:"The registers, ALU, buses and multiplexers that hold and transform data.",long:"The hardware that actually stores and processes data. It does nothing on its own; the control unit drives it with control signals."},{id:"control-path",term:"Control path",short:"The wires that carry control signals from the control unit to the datapath.",long:"Carries commands, not data: enables, selects and operation codes that decide what the datapath does in each step."},{id:"opcode",term:"Opcode",short:"The bits of an instruction that say which operation it is. Here, bits 15\u201312.",long:"Operation code. A 4-bit opcode can name up to 16 different instructions. This simulator uses 0001 ADD, 0010 SUB, 0011 LOAD, 0100 STORE and 0101 JUMP."},{id:"decoder",term:"Decoder",short:"A circuit with n inputs that raises exactly one of its 2\u207F outputs.",long:"The opcode decoder turns the 4-bit opcode into one-hot lines D0\u2013D15; the timing decoder turns the sequence counter into T0, T1, T2 \u2026"},{id:"pc",term:"Program counter (PC)",short:"Register holding the address of the next instruction to fetch.",long:"Incremented during every fetch. A jump loads it with a new address instead."},{id:"ir",term:"Instruction register (IR)",short:"Register holding the instruction currently being executed.",long:"Loaded during fetch. Its opcode field feeds the control unit; its register and address fields feed the datapath."},{id:"mdr",term:"Memory data register (MDR)",short:"Temporary register that holds a word just read from memory.",long:"Lets the value read in one step be written into a register in a later step."},{id:"register-file",term:"Register file",short:"The bank of general-purpose registers (R0\u2013R3 here), with read and write ports.",long:"Two read ports supply operands A and B; one write port stores a result, enabled by RegWrite."},{id:"alu",term:"ALU",short:"Arithmetic logic unit: performs the arithmetic or logic operation chosen by ALUOp.",long:"Here it adds or subtracts nging stored microinstructions rather than redesigning gate logic","It does not need an instruction register"],answer:2,explanation:"Try it in the Microprogrammed module: editing one microinstruction changes what ADD does. The hardwired unit would need new logic equations and rewiring."},{topic:"Advantages and disadvantages",question:"Which statement about speed is most accurate?",options:["Microprogrammed control is always faster","Hardwired control is often faster because signals come straight from gates, while microprogrammed control adds a control-memory read per step \u2014 but real results depend on the design","Both are always exactly the same speed","Speed depends only on the size of main memory"],answer:1,explanation:"Hardwired logic avoids the control-memory access, so it is often faster. Techniques such as overlapping the next microinstruction fetch reduce the gap, so neither is universally faster."},{topic:"Advantages and disadvantages",question:"Which kind of processor most commonly uses hardwired control?",options:["Simple, regular RISC-style processors where speed matters","Processors whose instruction set changes every week","Processors with hundreds of complex, multi-step instructions only","None; hardwired control is no longer used"],answer:0,explanation:"A small, regular instruction set keeps the logic manageable, so RISC designs typically use hardwired control. Large complex instruction sets have historically favoured microprogramming."}];var $=A(U(),1);function gf(t){let a=[...t];for(let r=a.length-1;r>0;r--){let e=Math.floor(Math.random()*(r+1));[a[r],a[e]]=[a[e],a[r]]}return a}function pf(t){return(t?gf(O1):O1).map(r=>{let e=t?gf(r.options.map((i,o)=>o)):r.options.map((i,o)=>o);return{...r,options:e.map(i=>r.options[i]),answer:e.indexOf(r.answer)}})}function U1(){let[t,a]=(0,Me.useState)(()=>pf(!1)),[r,e]=(0,Me.useState)(0),[i,o]=(0,Me.useState)(null),[n,l]=(0,Me.useState)([]),[d,c]=(0,Me.useState)(!1),u=t[r],h=n[r]!==void 0,f=(0,Me.useMemo)((
